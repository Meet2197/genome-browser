<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Genome Browser</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="authBar" style="background:#eef5ef; padding:6px 12px; font-size:13px; display:flex; gap:10px; align-items:center;">
  <span id="authStatus">Not logged in</span>
  <input id="authUsername" placeholder="username" style="width:100px;" />
  <input id="authPassword" type="password" placeholder="password" style="width:100px;" />
  <button id="loginBtn">Login</button>
  <button id="registerBtn">Register</button>
  <button id="logoutBtn" style="display:none;">Logout</button>
  <button id="bookmarkBtn" style="margin-left:auto;">🔖 Bookmark current view</button>
</div>

  <header class="topbar">
    <h1>🌱 Plant Microbiome Genome Browser</h1>
    <p>Explore plant-associated microbial genomes, annotations & comparative genomics</p>
    <a href="/synteny.html" style="color:white; margin-left:20px;">🔗 Synteny View</a>
  </header>
  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <h3>Available Genomes</h3>
      <input id="searchBox" placeholder="Search genomes..." />
      <div class="filters">
        <select id="hostFilter"><option value="">All Host Plants</option></select>
        <select id="envFilter"><option value="">All Environments</option></select>
        <select id="droughtFilter"><option value="">All Treatments</option></select>
      </div>
      <ul id="genomeList" class="genome-list"></ul>
      <div class="total">Total Genomes: <span id="totalCount">0</span></div>
    </aside>

    <!-- Main viewer -->
    <main class="viewer">
      <div style="padding:8px 12px; background:#f0f4f1; border-bottom:1px solid #ddd; display:flex; gap:8px; align-items:center; margin-bottom:8px;">
        <input id="globalSearchBox" placeholder="🔍 Search genes across all genomes (e.g. 'pyoverdine', 'acdS')..." style="flex:1; padding:6px;" />
        <div id="globalSearchResults" style="font-size:12px; color:#555;"></div>
      </div>
      <div class="viewer-header">
        <div>
          <strong>Genome:</strong> <span id="gName">-</span>
          &nbsp; <strong>Assembly:</strong> <span id="gAssembly">-</span>
          &nbsp; <strong>Length:</strong> <span id="gLength">-</span>
          &nbsp; <strong>GC%:</strong> <span id="gGC">-</span>
        </div>
      </div>

      <div class="nav-bar">
        <button id="prevBtn">◀</button>
        <button id="zoomOutBtn">－</button>
        <input id="startInput" type="number" placeholder="start"/>
        <input id="endInput" type="number" placeholder="end"/>
        <button id="goBtn">Go</button>
        <button id="zoomInBtn">＋</button>
        <button id="nextBtn">▶</button>
      </div>

      <canvas id="trackCanvas" width="1000" height="560"></canvas>
    </main>

    <!-- Detail panel -->
    <aside class="details">
      <h3>Details</h3>
      <div id="detailPanel">Select a gene to view details.</div>
    </aside>
  </div>

  <script src="app.js"></script>
</body>
</html>
